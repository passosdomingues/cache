<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Reserva de Quadras — MVC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Reserva de Quadras</h1>
  </header>

  <main>
    <section class="controls">
      <label>
        Data
        <input type="date" id="input-data" />
      </label>

      <label>
        Quadra
        <select id="select-quadra"></select>
      </label>

      <label>
        Intervalo
        <select id="select-intervalo">
          <option value="60">60 min</option>
          <option value="30">30 min</option>
        </select>
      </label>

      <button id="btn-limpar">Limpar do dia</button>
    </section>

    <section class="grade">
      <h2 id="titulo-grade"></h2>
      <div id="slots" class="slots"></div>
    </section>

    <section class="lista">
      <h2>Reservas do dia</h2>
      <ul id="lista-reservas"></ul>
    </section>
  </main>

  <footer>
    <small>Demo MVC — client-side</small>
  </footer>

  <script src="js/mvc.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
