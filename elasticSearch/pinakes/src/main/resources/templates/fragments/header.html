<!-- ===============================================================
     Pinakes -- Header Fragment
     Sticky top bar: hamburger | logo | meta | theme | a11y
     =============================================================== -->
<header th:fragment="header" class="header" id="main-header">
    <div class="header-left">
        <button id="hamburger-btn"
                class="header-icon-btn"
                aria-label="Open tuning panel"
                aria-controls="sidebar"
                aria-expanded="false">
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
        </button>
        <a th:href="@{/}" class="header-logo" aria-label="Pinakes — back to home">Pinakes</a>
    </div>

    <div class="header-right">
        <!-- Result count shown only when there are results -->
        <span th:if="${hasQuery != null and hasQuery and totalCount != null and totalCount > 0}"
              class="header-meta">
            <span th:text="${totalCount}">0</span> results
        </span>

        <!-- Theme toggle -->
        <button id="theme-toggle-btn"
                class="header-icon-btn"
                aria-label="Toggle theme">
            <i id="theme-icon-dark"  data-lucide="moon"  aria-hidden="true"></i>
            <i id="theme-icon-light" data-lucide="sun"   aria-hidden="true" style="display:none"></i>
        </button>

        <!-- Accessibility settings -->
        <button id="a11y-toggle-btn"
                class="header-icon-btn"
                aria-label="Accessibility settings"
                aria-controls="a11y-panel"
                aria-expanded="false">
            <i data-lucide="accessibility" aria-hidden="true"></i>
        </button>
    </div>
</header>
