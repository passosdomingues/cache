# ============================================================
#  Pinakes -- Application Configuration
#  server.port e server.servlet.context-path definidos em application.yml
#  All values overridable via env vars or Docker secrets.
# ============================================================

spring.application.name=pinakes-search

# ── Elasticsearch ─────────────────────────────────────────────
elasticsearch.host=${ES_HOST:localhost}
elasticsearch.port=${ES_PORT:9200}
elasticsearch.scheme=${ES_SCHEME:http}
elasticsearch.username=${ES_USER:}
elasticsearch.password=${ES_PASS:}

# Active index alias
elasticsearch.index=${ES_INDEX:wikipedia_v2}

# Connection pool
# FIX: socket-timeout-ms bumped to 15000 (was 10000) to avoid premature reads
elasticsearch.connection-timeout-ms=3000
elasticsearch.socket-timeout-ms=15000
elasticsearch.max-connections=25
elasticsearch.max-connections-per-route=5

# ── Resilience4j (retry for transient ES errors) ──────────────
# FIX: added org.apache.http.ConnectionClosedException to retry list
resilience4j.retry.instances.esClient.max-attempts=3
resilience4j.retry.instances.esClient.wait-duration=300ms
resilience4j.retry.instances.esClient.retry-exceptions=\
  java.io.IOException,\
  java.net.ConnectException,\
  org.apache.http.ConnectionClosedException

# ── Search defaults ───────────────────────────────────────────
search.default.page-size=10
search.default.max-page-size=50
search.default.fragment-size=400
search.default.num-fragments=1
search.default.fuzziness=AUTO
search.default.phrase-boost=2.0
search.default.title-boost=1.5
search.default.slop=0
search.default.minimum-should-match=1

# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────
logging.level.com.elasticsearch.search=DEBUG
logging.level.co.elastic.clients=INFO
