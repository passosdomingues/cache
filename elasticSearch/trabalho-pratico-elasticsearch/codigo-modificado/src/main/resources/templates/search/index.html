<!DOCTYPE html>
<html th:replace="~{layout/base :: html(title='WikiSearch', content=~{::main})}">
<head>
    <title>WikiSearch</title>
</head>
<body>
<main>
    <!-- Header (Oculto na tela inicial) -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Área Hero / Formulário de Busca -->
    <section class="hero" th:classappend="${hasQuery} ? 'hero-compact' : ''">
        <h1 class="hero-title" th:if="${!hasQuery}">WikiSearch</h1>
        <p class="hero-subtitle" th:if="${!hasQuery}">Busca ultrarrápida usando Elasticsearch e Spring Boot.</p>
        
        <!-- Componente Search Bar -->
        <th:block th:replace="~{fragments/search-bar :: search-bar}"></th:block>
    </section>

    <!-- Seção de Resultados -->
    <section th:if="${hasQuery}" class="results-section">
        
        <!-- Estado de erro -->
        <div th:if="${error != null}" class="empty-state">
            <i data-lucide="alert-circle" style="width: 48px; height: 48px; color: var(--accent-red);"></i>
            <h2 style="font-size: 1.25rem; font-weight: 500; margin-bottom: 8px;">Erro na busca</h2>
            <p th:text="${error}"></p>
        </div>

        <div th:if="${error == null}">
            <!-- Estado: Sem Resultados -->
            <div th:if="${!hasResults}" class="empty-state">
                <i data-lucide="search-x" style="width: 48px; height: 48px;"></i>
                <h2 style="font-size: 1.25rem; font-weight: 500; margin-bottom: 8px;">Nenhum resultado encontrado</h2>
                <p>Não encontramos documentos para a sua busca.</p>
            </div>

            <!-- Estado: Com Resultados -->
            <div th:if="${hasResults}">
                <div class="results-header">
                    <!-- Term Suggest (Spell Check) -->
                    <div th:if="${suggestion != null && suggestion.hasSuggestion}" class="spell-check">
                        Você quis dizer: 
                        <a th:href="@{/(query=${suggestion.suggestions[0]})}" th:text="${suggestion.suggestions[0]}">termo</a>?
                    </div>
                </div>

                <!-- Lista de Resultados -->
                <div class="results-list">
                    <th:block th:each="result : ${results}">
                        <!-- Renderiza o card passando o result -->
                        <th:block th:replace="~{fragments/result-item :: result-item(${result})}"></th:block>
                    </th:block>
                </div>

                <!-- Paginação -->
                <th:block th:replace="~{fragments/pagination :: pagination}"></th:block>
            </div>
        </div>
    </section>
</main>
</body>
</html>
