<!DOCTYPE html>
<html th:replace="~{layout/base :: html(title='Pinakes', content=~{::main})}">
<head>
    <title>Pinakes</title>
</head>
<body>
<main>
    <!-- Hero / Search Form -->
    <section class="hero" th:classappend="${hasQuery} ? 'hero-compact' : ''">
        <h1 class="hero-title" th:if="${!hasQuery}">Pinakes</h1>
        <p class="hero-subtitle" th:if="${!hasQuery}">Full-text search engine powered by Elasticsearch.</p>

        <!-- Search Bar Component -->
        <th:block th:replace="~{fragments/search-bar :: search-bar}"></th:block>
    </section>

    <!-- Results Section -->
    <section th:if="${hasQuery}" class="results-section">

        <!-- Error state -->
        <div th:if="${error != null}" class="empty-state">
            <i data-lucide="alert-circle" class="empty-state-icon empty-state-icon--error"></i>
            <h2 class="empty-state-title">Search error</h2>
            <p th:text="${error}"></p>
        </div>

        <div th:if="${error == null}">
            <!-- No results state -->
            <div th:if="${!hasResults}" class="empty-state">
                <i data-lucide="search-x" class="empty-state-icon"></i>
                <h2 class="empty-state-title">No results found</h2>
                <p>No documents matched your query. Try different keywords.</p>
            </div>

            <!-- Results -->
            <div th:if="${hasResults}">
                <div class="results-header">
                    <!-- Spell check suggestion -->
                    <div th:if="${suggestion != null && suggestion.hasSuggestion}" class="spell-check">
                        Did you mean:
                        <a th:href="@{/(query=${suggestion.suggestions[0]})}" th:text="${suggestion.suggestions[0]}">term</a>?
                    </div>
                </div>

                <!-- Result cards -->
                <div class="results-list">
                    <th:block th:each="result : ${results}">
                        <th:block th:replace="~{fragments/result-item :: result-item(${result})}"></th:block>
                    </th:block>
                </div>

                <!-- Pagination -->
                <th:block th:replace="~{fragments/pagination :: pagination}"></th:block>
            </div>
        </div>
    </section>
</main>
</body>
</html>
