<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="html(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">WikiSearch</title>
    
    <!-- Design System (CSS Modules) -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    
    <!-- Ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body th:class="${hasQuery} ? 'layout-results' : 'layout-compact'">

    <div class="page">
        <!-- Substituído pelo conteúdo da view atual -->
        <th:block th:replace="${content}"></th:block>
        
        <footer>
            Built with ⚡ Elasticsearch, Spring Boot & Thymeleaf.<br>
            <a href="https://github.com/rafael" target="_blank">View on GitHub</a>
        </footer>
    </div>

    <!-- Inicializa Lucide Icons -->
    <script>lucide.createIcons();</script>
    <!-- ES Modules Entry Point -->
    <script type="module" th:src="@{/js/app.js}"></script>
</body>
</html>
