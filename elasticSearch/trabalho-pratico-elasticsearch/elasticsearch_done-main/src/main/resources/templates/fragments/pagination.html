<div th:fragment="pagination" class="pagination" th:if="${totalPages > 1}">
    <div class="pagination-info">
        Page <strong th:text="${page}">1</strong> of <strong th:text="${totalPages}">10</strong>
    </div>
    <div class="pagination-controls">
        <a th:href="@{/(query=${query}, page=${page - 1})}"
           class="page-btn"
           th:classappend="${page <= 1} ? 'disabled' : ''"
           aria-label="Previous page">
            <i data-lucide="chevron-left"></i>
            Previous
        </a>
        <a th:href="@{/(query=${query}, page=${page + 1})}"
           class="page-btn"
           th:classappend="${page >= totalPages} ? 'disabled' : ''"
           aria-label="Next page">
            Next
            <i data-lucide="chevron-right"></i>
        </a>
    </div>
</div>
