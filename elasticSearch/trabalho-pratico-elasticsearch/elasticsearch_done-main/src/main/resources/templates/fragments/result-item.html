<!-- ===============================================================
     Pinakes -- Result Item Fragment
     Single result card with URL, title, and highlighted abstract.
     =============================================================== -->
<article th:fragment="result-item(result)" class="result-card">
    <a th:href="${result.url}" target="_blank" rel="noopener" class="result-url" th:text="${result.url}">https://example.com</a>
    <a th:href="${result.url}" target="_blank" rel="noopener" class="result-title" th:text="${result.title}">Document Title</a>

    <!-- Abstract with ES highlight <strong> tags rendered as HTML -->
    <p class="result-abs" th:utext="${result.abs}">Document abstract...</p>
</article>
