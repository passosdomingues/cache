<!-- ===============================================================
     Pinakes -- Hyperparameter Tuning Sidebar
     =============================================================== -->
<div th:fragment="sidebar" id="sidebar" class="sidebar" role="dialog" aria-label="Hyperparameter Tuning" aria-hidden="true">
    <div class="sidebar-header">
        <span class="sidebar-brand">Tuning Panel</span>
        <button id="sidebar-close-btn" class="sidebar-close" aria-label="Close menu">
            <i data-lucide="x"></i>
        </button>
    </div>

    <form id="tuning-form" class="sidebar-form" method="GET" th:action="@{/}">
        <input type="hidden" name="query" th:value="${query}">
        
        <div class="sidebar-scrollable">
            <!-- ── Text Analysis ─────────────────────────────── -->
            <h3 class="sidebar-section-title">Text Analysis & Matching</h3>

            <div class="tune-group">
                <label for="fuzziness" class="tune-label">
                    Fuzzy Matching (Levenshtein)
                    <span class="tune-help" title="Allows spelling mistakes">
                        <i data-lucide="help-circle"></i>
                    </span>
                </label>
                <select id="fuzziness" name="fuzziness" class="tune-select">
                    <option value="AUTO" th:selected="${fuzziness == 'AUTO'}">AUTO (Length-based)</option>
                    <option value="0" th:selected="${fuzziness == '0'}">0 (Exact match only)</option>
                    <option value="1" th:selected="${fuzziness == '1'}">1 (Up to 1 typo)</option>
                    <option value="2" th:selected="${fuzziness == '2'}">2 (Up to 2 typos)</option>
                </select>
            </div>

            <div class="tune-group">
                <label for="slop" class="tune-label">
                    Phrase Slop
                    <span class="tune-help" title="Allowed distance between phrase words">
                        <i data-lucide="help-circle"></i>
                    </span>
                </label>
                <div class="range-wrapper">
                    <input type="range" id="slop" name="slop" min="0" max="20" step="1" th:value="${slop != null ? slop : 0}" class="tune-range">
                    <span class="range-val" id="slop-val" th:text="${slop != null ? slop : 0}">0</span>
                </div>
            </div>

            <hr class="sidebar-divider">

            <!-- ── BM25 Relevance Scoring ──────────────────────── -->
            <h3 class="sidebar-section-title">BM25 Relevance Scoring</h3>

            <div class="tune-group">
                <label for="phraseBoost" class="tune-label">
                    Exact Phrase Boost
                    <span class="tune-help" title="Multiplier for documents containing the exact phrase">
                        <i data-lucide="help-circle"></i>
                    </span>
                </label>
                <div class="range-wrapper">
                    <input type="range" id="phraseBoost" name="phraseBoost" min="0" max="5" step="0.5" th:value="${phraseBoost != null ? phraseBoost : 2.0}" class="tune-range">
                    <span class="range-val" id="phraseBoost-val" th:text="${phraseBoost != null ? phraseBoost : 2.0}">2.0</span>
                </div>
            </div>

            <div class="tune-group">
                <label for="titleBoost" class="tune-label">
                    Title Boost
                    <span class="tune-help" title="Multiplier for title matches vs content matches">
                        <i data-lucide="help-circle"></i>
                    </span>
                </label>
                <div class="range-wrapper">
                    <input type="range" id="titleBoost" name="titleBoost" min="0" max="5" step="0.5" th:value="${titleBoost != null ? titleBoost : 1.5}" class="tune-range">
                    <span class="range-val" id="titleBoost-val" th:text="${titleBoost != null ? titleBoost : 1.5}">1.5</span>
                </div>
            </div>

            <hr class="sidebar-divider">

            <!-- ── Presentation ────────────────────────────────── -->
            <h3 class="sidebar-section-title">Presentation</h3>

            <div class="tune-group tune-toggle">
                <label for="highlight" class="tune-label">Enable Term Highlighting</label>
                <label class="switch">
                    <input type="checkbox" id="highlight" name="highlight" value="true" th:checked="${highlight == null || highlight}">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="tune-group tune-toggle">
                <label for="spellCheck" class="tune-label">Enable "Did you mean?"</label>
                <label class="switch">
                    <input type="checkbox" id="spellCheck" name="spellCheck" value="true" th:checked="${spellCheck == null || spellCheck}">
                    <span class="slider round"></span>
                </label>
            </div>
            
            <!-- Hidden inputs to submit unchecked checkboxes properly -->
            <input type="hidden" name="highlight" value="false" id="highlight-hidden" disabled>
            <input type="hidden" name="spellCheck" value="false" id="spellCheck-hidden" disabled>
        </div>

        <div class="sidebar-footer">
            <button type="button" id="reset-tuning-btn" class="btn-outline">Reset Defaults</button>
            <button type="submit" class="btn-primary">Apply Tuning</button>
        </div>
    </form>
</div>

<!-- Backdrop overlay -->
<div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
