<!-- ===============================================================
     Pinakes -- Accessibility Panel Fragment
     Floating panel for font size and contrast controls.
     Theme toggle was moved to the header for discoverability.
     =============================================================== -->
<div th:fragment="accessibilityPanel"
     id="a11y-panel"
     class="a11y-panel"
     role="dialog"
     aria-label="Display settings"
     aria-hidden="true">

    <div class="a11y-panel-header">
        <span>Display</span>
        <button id="a11y-panel-close" class="a11y-panel-close" aria-label="Close display settings">
            <i data-lucide="x" style="width:16px;height:16px;" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Font size -->
    <div class="a11y-group">
        <span class="a11y-label" id="font-size-label">Font size</span>
        <div class="a11y-controls a11y-btn-group" role="group" aria-labelledby="font-size-label">
            <button class="a11y-btn font-scale-btn" data-scale="small"  aria-label="Small font">A−</button>
            <button class="a11y-btn font-scale-btn active" data-scale="medium" aria-label="Medium font">A</button>
            <button class="a11y-btn font-scale-btn" data-scale="large"  aria-label="Large font">A+</button>
        </div>
    </div>

    <!-- High contrast -->
    <div class="a11y-group">
        <span class="a11y-label" id="contrast-label">Contrast</span>
        <div class="a11y-controls" role="group" aria-labelledby="contrast-label">
            <button id="contrast-toggle-btn" class="a11y-btn" aria-pressed="false">
                <i data-lucide="contrast" class="a11y-icon" aria-hidden="true"></i>
                <span id="contrast-label-text">Normal</span>
            </button>
        </div>
    </div>
</div>
