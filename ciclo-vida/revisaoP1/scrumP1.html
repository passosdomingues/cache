<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estudos KANBAN do PO Ágil (Versão Expandida)</title>
    <style>
        :root {
            /* Cores suaves - modo claro */
            --background-color: #f8f9fa;
            --main-text-color: #2d3436;
            --secondary-text-color: #636e72;
            --primary-color: #6c5ce7;
            --primary-hover-color: #5649c9;
            --secondary-color: #00b894;
            --tertiary-color: #fdcb6e;
            --card-bg-color: #ffffff;
            --board-bg-color: #e9ebee;
            --column-header-bg: #f8f9fa;
            --border-color: #d1d5da;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --code-font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            --success-color: #00b894;
            --warning-color: #fdcb6e;
            --danger-color: #d63031;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        /* Modo escuro (default) */
        body.dark-mode {
            --background-color: #1a1a1a;
            --main-text-color: #e6e6e6;
            --secondary-text-color: #b3b3b3;
            --primary-color: #8a7df8;
            --primary-hover-color: #9d92ff;
            --secondary-color: #00d8a4;
            --tertiary-color: #ffd97a;
            --card-bg-color: #2d2d2d;
            --board-bg-color: #252525;
            --column-header-bg: #333333;
            --border-color: #444;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --success-color: #00d8a4;
            --warning-color: #ffd97a;
            --danger-color: #ff7675;
        }

        /* Reset Básico e Configuração */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            transition: var(--transition);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--main-text-color);
            line-height: 1.7;
            font-size: 16px;
        }
        
        /* Cabeçalho Principal */
        header {
            background-color: var(--card-bg-color);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            z-index: 10;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--secondary-text-color);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--primary-color);
        }

        #reset-button {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        #reset-button:hover {
            background-color: var(--danger-color);
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Quadro Kanban */
        #kanban-board {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            height: calc(100vh - 70px);
            overflow-x: auto;
            background-color: var(--board-bg-color);
        }

        .kanban-column {
            flex: 1;
            min-width: 320px;
            max-width: 320px;
            background-color: var(--column-header-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }
        
        .kanban-column:hover {
             box-shadow: 0 8px 16px var(--shadow-color);
        }

        .kanban-column h2 {
            font-size: 1.1rem;
            padding: 1rem;
            border-bottom: 2px solid var(--border-color);
            background-color: var(--card-bg-color);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: var(--primary-color);
        }

        .kanban-cards {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            transition: var(--transition);
            min-height: 200px;
            border-radius: 0 0 12px 12px;
        }
        
        .kanban-cards.drag-over {
            background-color: rgba(108, 92, 231, 0.1);
        }

        /* Cartões Kanban */
        .kanban-card {
            background-color: var(--card-bg-color);
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: var(--transition);
            border-left: 5px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        .kanban-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--shadow-color);
        }
        
        .kanban-card.dragging {
            opacity: 0.6;
            transform: rotate(4deg);
        }

        .card-sprint {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: inline-block;
            background-color: rgba(108, 92, 231, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .card-title {
            font-weight: 600;
            color: var(--main-text-color);
            margin-bottom: 0.5rem;
        }

        .card-description {
            font-size: 0.9rem;
            color: var(--secondary-text-color);
            margin-bottom: 0.5rem;
        }

        .card-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .card-link {
            font-size: 0.75rem;
            color: var(--primary-color);
            text-decoration: none;
            padding: 3px 8px;
            border-radius: 8px;
            background-color: rgba(108, 92, 231, 0.1);
            transition: var(--transition);
        }

        .card-link:hover {
            background-color: rgba(108, 92, 231, 0.2);
        }

        /* Modal para Conteúdo */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: var(--card-bg-color);
            margin: 4% auto;
            padding: 30px 40px;
            border: 1px solid var(--border-color);
            width: 85%;
            max-width: 950px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .close-button {
            color: var(--secondary-text-color);
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-button:hover,
        .close-button:focus {
            color: var(--primary-color);
        }
        
        .modal-body {
            overflow-y: auto;
            padding-right: 15px;
            flex: 1;
        }
        
        .modal-body h3 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-hover-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            font-size: 1.4rem;
        }
        
         .modal-body h4 {
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: var(--main-text-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-body p, .modal-body ul, .modal-body ol {
            margin-bottom: 1rem;
            color: var(--secondary-text-color);
        }

        .modal-body ul, .modal-body ol {
            padding-left: 25px;
        }
        
        .modal-body li {
            margin-bottom: 0.7rem;
        }
        
        .modal-body code {
            background-color: rgba(108, 92, 231, 0.1);
            padding: 3px 7px;
            border-radius: 4px;
            font-family: var(--code-font-family);
            color: var(--primary-color);
            font-size: 0.9rem;
        }
        
        .modal-body blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--secondary-text-color);
            background-color: rgba(108, 92, 231, 0.05);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
        }
        
        .modal-body a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .modal-body a:hover {
            text-decoration: underline;
        }

        .related-cards {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .related-cards h4 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .related-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .related-link {
            padding: 0.5rem 1rem;
            background-color: rgba(108, 92, 231, 0.1);
            border-radius: 8px;
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .related-link:hover {
            background-color: rgba(108, 92, 231, 0.2);
            transform: translateY(-2px);
        }
        
        /* Flashcards */
        .flashcard-container {
            perspective: 1000px;
            margin: 1.5rem 0;
            background-color: transparent;
            width: 100%;
            min-height: 140px;
            border-radius: 8px;
        }
        
        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 140px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 8px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow-color);
        }
        
        .flashcard-front {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.1) 0%, rgba(108, 92, 231, 0.2) 100%);
            border: 1px solid var(--primary-color);
        }

        .flashcard-front-title {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--primary-hover-color);
            text-align: center;
        }
        
        .flashcard-front-instruction {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            margin-top: 10px;
            font-style: italic;
        }

        .flashcard-back {
            background: var(--card-bg-color);
            transform: rotateY(180deg);
            border: 1px solid var(--border-color);
            color: var(--secondary-text-color);
            font-size: 1rem;
            text-align: center;
        }
        
        /* Estilos de Gráfico Dinâmico */
        .chart-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            background: var(--card-bg-color);
        }

        .burndown-chart {
            width: 100%;
            height: 300px;
            position: relative;
        }

        .burndown-chart .ideal-line {
            stroke: var(--danger-color);
            stroke-dasharray: 6, 6;
            stroke-width: 2;
        }
        
        .burndown-chart .actual-line {
            stroke: var(--primary-color);
            stroke-width: 2.5;
            fill: none;
        }
        
        .burndown-chart .point {
            fill: var(--primary-hover-color);
            cursor: pointer;
            transition: r 0.2s;
        }
        
        .burndown-chart .point:hover {
            r: 7;
        }
        
        .burndown-chart .axis {
            stroke: var(--secondary-text-color);
            stroke-width: 1.5;
        }
        
        .burndown-chart .label {
            font-size: 12px;
            fill: var(--secondary-text-color);
        }
        
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 20px;
            height: 10px;
            margin-right: 8px;
            border-radius: 2px;
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Classes Utilitárias */
        .highlight {
            background-color: rgba(253, 203, 110, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-weight: 500;
            color: var(--main-text-color);
        }

        .tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-right: 0.5rem;
        }

        .tag-primary {
            background-color: rgba(108, 92, 231, 0.1);
            color: var(--primary-color);
        }

        .tag-secondary {
            background-color: rgba(0, 184, 148, 0.1);
            color: var(--secondary-color);
        }

        .tag-tertiary {
            background-color: rgba(253, 203, 110, 0.2);
            color: var(--warning-color);
        }

        /* Responsividade */
        @media (max-width: 1200px) {
            #kanban-board {
                flex-wrap: wrap;
                height: auto;
                overflow-y: auto;
            }
            
            .kanban-column {
                min-width: calc(50% - 1rem);
                margin-bottom: 1rem;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .header-controls {
                width: 100%;
                justify-content: center;
            }
            
            .kanban-column {
                min-width: 100%;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
                margin: 2% auto;
            }
        }
    </style>
</head>
<body class="dark-mode">

    <header>
        <h1>Guia de Estudos KANBAN do PO Ágil (Versão Expandida)</h1>
        <div class="header-controls">
            <button class="theme-toggle" id="theme-toggle">🌙</button>
            <button id="reset-button">Resetar Quadro</button>
        </div>
    </header>

    <main id="kanban-board">
        <div class="kanban-column" id="backlog">
            <h2>Backlog</h2>
            <div class="kanban-cards" data-column-id="backlog"></div>
        </div>
        <div class="kanban-column" id="todo">
            <h2>A Fazer (To Do)</h2>
            <div class="kanban-cards" data-column-id="todo"></div>
        </div>
        <div class="kanban-column" id="inprogress">
            <h2>Em Progresso</h2>
            <div class="kanban-cards" data-column-id="inprogress"></div>
        </div>
        <div class="kanban-column" id="done">
            <h2>Concluído (Done)</h2>
            <div class="kanban-cards" data-column-id="done"></div>
        </div>
    </main>

    <div id="contentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body" id="modal-body">
                </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const studyData = [
            // SPRINT 1: FUNDAÇÕES
            {
                id: 's1-1', 
                sprint: 'SPRINT 1: Fundações do PO', 
                title: 'O Papel do Product Owner (PO)', 
                description: 'Entenda o papel fundamental do PO no time Scrum e suas responsabilidades principais',
                content: `
                    <h3>O que é um Product Owner?</h3>
                    <p>O Product Owner é um membro fundamental do Time Scrum, atuando como o principal responsável por maximizar o valor do produto que resulta do trabalho do Time de Desenvolvimento. Ele é a única pessoa com a autoridade para gerenciar o Product Backlog, servindo como a ponte essencial entre os stakeholders (partes interessadas) e o time técnico.</p>
                    
                    <blockquote>O PO é o dono do "o quê" e do "porquê". O Time de Desenvolvimento é o dono do "como".</blockquote>
                    
                    <div class="flashcard-container">
                        <div class="flashcard" onclick="this.classList.toggle('is-flipped')">
                            <div class="flashcard-face flashcard-front">
                                <span class="flashcard-front-title">Principal Responsabilidade do PO</span>
                                <span class="flashcard-front-instruction">(Clique para revelar)</span>
                            </div>
                            <div class="flashcard-face flashcard-back">
                                <span>Maximizar o valor do produto através do gerenciamento contínuo e priorização do Product Backlog. Isso inclui sua criação, ordenação e garantia de que ele seja visível, transparente e compreendido por todos.</span>
                            </div>
                        </div>
                    </div>
                    
                    <h3>Responsabilidades Chave Detalhadas:</h3>
                    <ul>
                        <li><b>Definir e Comunicar a Visão:</b> Criar uma visão de produto clara, inspiradora e alinhada com os objetivos da empresa. O PO deve garantir que todos no Time Scrum entendam essa visão.</li>
                        <li><b>Gerenciar o Product Backlog:</b> Esta é uma atividade contínua que envolve:
                            <ul>
                                <li>Expressar claramente os itens do Backlog (PBI - Product Backlog Items).</li>
                                <li>Ordenar os itens para otimizar o alcance de metas e missões.</li>
                                <li>Garantir que o valor do trabalho que o time realiza seja maximizado.</li>
                                <li>Assegurar que o Backlog seja visível, transparente e claro para todos.</li>
                            </ul>
                        </li>
                        <li><b>Gerenciamento de Stakeholders:</b> O PO é a voz do cliente e do negócio. Deve interagir constantemente com clientes, usuários e outras partes interessadas para coletar feedback, entender suas necessidades e gerenciar suas expectativas.</li>
                        <li><b>Participação Ativa nos Eventos Scrum:</b> O PO não é um participante passivo. Ele colabora na Sprint Planning, inspeciona o incremento na Sprint Review e fornece esclarecimentos durante a Daily Scrum, se necessário.</li>
                        <li><b>Tomada de Decisão:</b> O PO tem a palavra final sobre o conteúdo e a ordem do Product Backlog. A organização deve respeitar suas decisões.</li>
                    </ul>
                    
                    <h3>Origens do Papel do PO</h3>
                    <p>O papel do Product Owner surgiu como resposta direta a um problema prático em desenvolvimento de software: a separação entre quem decidia o rumo do produto e quem entregava valor diariamente. Essa separação criava desperdício, priorizações erradas e expectativas desalinhadas.</p>
                    <p>O Product Owner veio para colar essa ponte, traduzindo estratégia em trabalho do time e garantindo que cada esforço tivesse relação clara com o valor para o usuário e para o negócio. Ser Product Owner não é apenas cuidar de uma lista, é assumir a responsabilidade pela narrativa que guia o produto ao longo do tempo.</p>
                    
                    <div class="related-cards">
                        <h4>Conteúdos Relacionados</h4>
                        <div class="related-links">
                            <a href="#" class="related-link" data-card="s1-2">Características de um PO Eficaz</a>
                            <a href="#" class="related-link" data-card="s1-3">Erros Comuns do PO</a>
                            <a href="#" class="related-link" data-card="s6-1">Dicas para ser um Grande PO</a>
                        </div>
                    </div>
                `,
                related: ['s1-2', 's1-3', 's6-1']
            },
            {
                id: 's1-2', 
                sprint: 'SPRINT 1: Fundações do PO', 
                title: 'Características de um PO Eficaz', 
                description: 'Conheça as habilidades e comportamentos que definem um Product Owner de sucesso',
                content: `
                    <h3>O Perfil Ideal do Product Owner</h3>
                    <p>Um PO eficaz combina habilidades de negócio, comunicação e liderança. Não se trata apenas de um cargo, mas de uma mentalidade focada em entregar valor.</p>
                    
                    <h4>Domínio do Negócio (Domainer)</h4>
                    <p>Um PO precisa ter um profundo conhecimento do mercado, dos usuários e do negócio para tomar decisões informadas sobre o produto.</p>
                    
                    <h4>Comunicador e Negociador</h4>
                    <p>Ele deve ser capaz de articular a visão e as necessidades dos stakeholders de forma clara para o time. Também precisa negociar prioridades com stakeholders que frequentemente têm interesses conflitantes, sempre buscando o maior valor global.</p>
                    
                    <h4>Líder Servidor e Jogador de Time</h4>
                    <p>O PO lidera pelo exemplo e pela visão, não pela autoridade. Ele guia o time em direção ao objetivo do produto e é um membro colaborativo do Time Scrum.</p>
                    
                    <h4>Empoderado e Comprometido</h4>
                    <p>A organização deve dar ao PO a autoridade para tomar decisões sobre o produto. Um PO sem poder de decisão se torna um gargalo. Ele deve ser totalmente comprometido com o sucesso do produto.</p>
                    
                    <h4>Disponível e Qualificado</h4>
                    <p>Um "PO ausente" é um grande problema. Ele precisa estar disponível para o time para tirar dúvidas e dar feedback rápido. Além disso, deve ter o conhecimento necessário para desempenhar o papel.</p>
                    
                    <div class="flashcard-container">
                        <div class="flashcard" onclick="this.classList.toggle('is-flipped')">
                            <div class="flashcard-face flashcard-front">
                                <span class="flashcard-front-title">A Analogia da Furadeira</span>
                                <span class="flashcard-front-instruction">(Clique para revelar)</span>
                            </div>
                            <div class="flashcard-face flashcard-back">
                                <span>"As pessoas não querem uma furadeira de 3/4 de polegada. Elas querem um buraco de 3/4 de polegada." - Theodore Levitt. <br/>Isso lembra o PO de focar no problema do usuário e no valor (o buraco), não apenas na solução ou na feature (a furadeira).</span>
                            </div>
                        </div>
                    </div>
                    
                    <h3>Habilidades Essenciais para o PO</h3>
                    <p>Para desempenhar essa função com qualidade é preciso um conjunto de características que se reforçam:</p>
                    <ul>

                        <li><b>Comunicação eficaz:</b> O PO negocia expectativas com clientes, alinha prioridades com gestores e esclarece dúvidas com desenvolvedores.</li>
                        <li><b>Disponibilidade e autoridade:</b> Sem autoridade e sem disponibilidade o papel perde efeito, por isso o PO precisa ter poder real de decisão e tempo suficiente para se dedicar ao produto.</li>
                    </ul>
                    
                    <div class="related-cards">
                        <h4>Conteúdos Relacionados</h4>
                        <div class="related-links">
                            <a href="#" class="related-link" data-card="s1-1">O Papel do Product Owner</a>

                            <a href="#" class="related-link" data-card="s6-2">O Dia a Dia do PO</a>

                `,

            {
                id: 's1-3', 
                sprint: 'SPRINT 1: Fundações do PO', 
                title: 'Erros Comuns (Anti-Padrões) do PO', 
                description: 'Aprenda a identificar e evitar as armadilhas mais comuns no papel de Product Owner',
                content: `
                    <h3>Armadilhas a Evitar no Papel de PO</h3>
                    <p>Vários anti-padrões podem minar a eficácia de um Product Owner e prejudicar o progresso do time. Reconhecê-los é o primeiro passo para evitá-los.</p>
                    
                    <ul>
                        <li><b>O PO "Escriba":</b> Um PO que apenas anota pedidos dos stakeholders sem ter poder real de decisão sobre prioridades. Ele se torna um intermediário, não um dono do produto.</li>
                        <li><b>O PO "Sobrecarregado":</b> Um PO responsável por muitos produtos ou times ao mesmo tempo. Ele se torna um gargalo, incapaz de dar a atenção necessária a cada um.</li>
                        <li><b>O PO "Parcial":</b> Um PO que favorece um grupo de stakeholders em detrimento de outros, falhando em equilibrar as necessidades de todos para maximizar o valor total.</li>
                        <li><b>O PO "Fantasma" ou "Distante":</b> Um PO que não está regularmente disponível para o time. Isso causa mal-entendidos, atrasos e trabalho que não atende às expectativas.</li>
                        <li><b>O PO "Proxy":</b> Alguém que atua como intermediário para o verdadeiro tomador de decisão. Isso quebra a comunicação direta e a agilidade.</li>
                        <li><b>O PO "Comitê":</b> Decisões sobre o produto são tomadas por um comitê. Isso leva a resultados lentos e comprometidos. O PO deve ser um indivíduo único e decisivo.</li>
                        <li><b>O PO "Focado em Features":</b> Um PO que apenas se concentra em entregar uma lista de funcionalidades, perdendo de vista o valor para o negócio e o resultado para o usuário.</li>
                    </ul>
                    
                    <h3>Impacto dos Anti-Padrões</h3>
                    <p>Erros repetidos minam a efetividade do papel. Um PO sem poder real transforma decisões em reuniões intermináveis. Um PO sobrecarregado atende mal todas as demandas. Um PO parcial privilegia interesses e perde foco. Um PO distante cria ruído e atrasos. Substitutos improvisados e comitês que diluem decisão geram indecisão e lentidão.</p>
                    
                    <p>Reconhecer essas falhas com honestidade é passo prévio para corrigir processos e responsabilidades. O relacionamento com o time é o coração do trabalho. Estar presente em discussões, abrir espaço para perguntas, esclarecer hipóteses e validar suposições reduz retrabalho e acelera aprendizado.</p>
                    
                    <div class="related-cards">
                        <h4>Conteúdos Relacionados</h4>

                            <a href="#" class="related-link" data-card="s6-1">Dicas para ser um Grande PO</a>
                        </div>
                    </div>
                `,
                related: ['s1-1', 's1-2', 's6-1']

            // SPRINT 2: VISÃO & ESTRATÉGIA
            {
                id: 's2-1', 
                sprint: 'SPRINT 2: Visão e Estratégia de Produto', 
                title: 'Definindo a Visão do Produto', 
                description: 'Aprenda a criar uma visão clara e inspiradora para seu produto',
                content: `
                    <h3>Capturando a Essência do Produto</h3>
                    <p>A visão do produto é uma declaração concisa que descreve o objetivo de longo prazo do produto. Ela serve como uma "Estrela Guia" para o Time Scrum e todos os stakeholders, garantindo que todos estejam remando na mesma direção.</p>
                    
                    <h4>Qualidades de uma Visão Forte:</h4>
                    <ul>
                        <li><b>Compartilhada e Unificada:</b> Todos no time e os principais stakeholders devem acreditar e apoiar a visão.</li>
                        <li><b>Ampla e Engajadora:</b> Deve ser inspiradora e dar espaço para o time ser criativo na busca por soluções, em vez de prescrever a solução.</li>
                        <li><b>Curta e Clara:</b> Fácil de lembrar e repetir. Pense nela como um "elevator pitch".</li>
                    </ul>
                    
                    <h4>Ferramentas para Criar a Visão</h4>
                    <p>Um template popular é o "Elevator Pitch" de Geoffrey Moore:</p>
                    
                    <blockquote>
                        <b>PARA</b> [cliente alvo]<br>
                        <b>QUE</b> [necessidade ou oportunidade]<br>
                        <b>O</b> [nome do produto] <b>É UM</b> [categoria do produto]<br>
                        <b>QUE</b> [benefício chave, razão para comprar].<br>
                        <b>DIFERENTE DE</b> [alternativa da concorrência]<br>
                        <b>NOSSO PRODUTO</b> [diferencial chave].
                    </blockquote>
                    
                    <h3>A Visão como Bússola</h3>
                    <p>A visão do produto funciona como bússola. Ela responde quem compra, quem usa, quais necessidades são atendidas e que diferença o produto traz ao mercado. Essa visão deve ser curta, compartilhada e capaz de orientar trade offs.</p>
                    
                    <p>A noção de produto mínimo é consequente dessa visão; lançar uma versão que entregue o valor essencial permite aprender com velocidade, reduzir riscos e construir sobre feedback real. Menos é mais quando isso significa concentrar energia nas hipóteses mais importantes e testar rapidamente se elas estão corretas.</p>
                    
                    <div class="related-cards">
                        <h4>Conteúdos Relacionados</h4>
                        <div class="related-links">
                            <a href="#" class="related-link" data-card="s2-2">Produto Mínimo Viável (MVP)</a>
                            <a href="#" class="related-link" data-card="s2-3">Roadmap de Produto</a>
                            <a href="#" class="related-link" data-card="s3-1">O que é o Product Backlog?</a>
                        </div>
                    </div>
                `,
                related: ['s2-2', 's2-3', 's3-1']
            },
            // Outros cards continuariam aqui...
            // SPRINT 6: TÓPICOS AVANÇADOS E RECURSOS
            {
                id: 's6-1',
                sprint: 'SPRINT 6: Tópicos Avançados e Recursos',
                title: 'Dicas para ser um Grande PO',
                description: 'Aprimore suas habilidades e torne-se um Product Owner excepcional',
                content: `
                    <h3>Aprimorando suas Habilidades como Product Owner</h3>
                    <p>Além das características e responsabilidades fundamentais, um grande Product Owner cultiva um conjunto de atitudes e comportamentos que elevam o time e o produto. Estas são dicas essenciais para a excelência no papel.</p>
                    
                    <h4>Relação com o Time</h4>
                    <ul>
                        <li><b>Seja comprometido com o time:</b> Sua presença e engajamento inspiram confiança e motivação. Trabalhe junto com eles, não apenas para eles.</li>
                        <li><b>Confie nos membros do time:</b> O PO define o "o quê" e o "porquê". Deixe o "como" para o Time de Desenvolvimento. A microgestão destrói a autonomia e a criatividade.</li>
                        <li><b>Encoraje a transparência e respeite as pessoas:</b> Crie um ambiente psicologicamente seguro onde a verdade pode ser dita sem medo. Respeite as estimativas e as opiniões técnicas do time.</li>
                    </ul>

                    <h4>Foco e Desenvolvimento Pessoal</h4>
                    <ul>
                        <li><b>Foque no trabalho de PO:</b> Evite acumular papéis, como Scrum Master ou gerente de projetos. O papel de PO exige dedicação total para ser bem executado.</li>
                        <li><b>Dê tempo a si mesmo para aprender:</b> Ninguém nasce um PO perfeito. É um papel complexo que exige aprendizado contínuo. Seja paciente e busque feedback.</li>
                        <li><b>Obtenha treinamento e mentoria:</b> Invista em seu desenvolvimento profissional com cursos, certificações e, se possível, a orientação de um PO mais experiente.</li>
                    </ul>

                    <h4>Contexto Organizacional</h4>
                    <ul>
                        <li><b>Assegure suporte no nível apropriado:</b> Um PO precisa de apoio da gestão para tomar decisões e remover impedimentos organizacionais. Seu sucesso depende de ter a autonomia e o empoderamento necessários.</li>
                    </ul>
                    
                    <h3>Práticas Deliberadas para se Tornar Notável</h3>
                    <p>Para se tornar um Product Owner notável é preciso cultivar práticas deliberadas:</p>
                    <ul>
                        <li><b>Comprometimento com o time:</b> Priorizar a disponibilidade para as interações que aceleram entendimento e remoção de bloqueios.</li>
                        <li><b>Foco no trabalho de PO:</b> Separar responsabilidades e evitar dispersão em atividades que tiram o foco estratégico.</li>
                        <li><b>Incentivar transparência e respeitar as pessoas:</b> Construir um ambiente onde problemas aparecem cedo e são resolvidos com colaboração.</li>
                        <li><b>Confiar no time:</b> Permitir que ele proponha soluções estimula responsabilidade e melhora a qualidade das decisões.</li>
                        <li><b>Conceder tempo para aprender:</b> Buscar treinamento formal e coaching e solicitar apoio da liderança quando necessário.</li>
                        <li><b>Garantir suporte adequado:</b> Evitar que o PO seja refém de conflitos políticos e permitir que priorizações reflitam valor real.</li>
                    </ul>
                    
                    <blockquote>Um Product Owner efetivo traduz visão em entregas, protege o tempo do time, valida hipóteses com rapidez e mantém o foco no valor ao usuário. Tornar-se um grande PO exige prática deliberada, humildade para aprender com erros e firmeza para defender prioridades que geram impacto.</blockquote>
                    
                    <div class="related-cards">
                        <h4>Conteúdos Relacionados</h4>
                        <div class="related-links">
                            <a href="#" class="related-link" data-card="s1-2">Características de um PO Eficaz</a>
                            <a href="#" class="related-link" data-card="s6-2">O Dia a Dia do PO</a>
                            <a href="#" class="related-link" data-card="s6-3">Referências: Livros e Sites</a>
                        </div>
                    </div>
                `,
                related: ['s1-2', 's6-2', 's6-3']
            }
            // Outros cards continuariam aqui...
        ];

        // Gerenciamento de estado
        let state = {
            cards: {},
            columns: {
                'backlog': [],
                'todo': [],
                'inprogress': [],
                'done': []
            }
        };

        const modal = document.getElementById('contentModal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const closeButton = document.querySelector('.close-button');
        const resetButton = document.getElementById('reset-button');
        const themeToggle = document.getElementById('theme-toggle');
        
        // Função para salvar o estado
        function saveState() {
            localStorage.setItem('kanbanState_v4', JSON.stringify(state));
        }

        // Função para carregar o estado
        function loadState() {
            const savedState = localStorage.getItem('kanbanState_v4');
            if (savedState) {
                state = JSON.parse(savedState);
                const loadedCardIds = new Set(Object.keys(state.cards));
                studyData.forEach(cardData => {
                    if (!loadedCardIds.has(cardData.id)) {
                        state.cards[cardData.id] = cardData;
                        if (!Object.values(state.columns).flat().includes(cardData.id)) {
                           state.columns.backlog.push(cardData.id);
                        }
                    }
                });
            } else {
                studyData.forEach(cardData => {
                    state.cards[cardData.id] = cardData;
                    state.columns.backlog.push(cardData.id);
                });
            }
        }

        // Função para renderizar o quadro
        function renderBoard() {
            Object.keys(state.columns).forEach(columnId => {
                const columnEl = document.querySelector(`[data-column-id="${columnId}"]`);
                columnEl.innerHTML = '';
                state.columns[columnId].forEach(cardId => {
                    const cardData = state.cards[cardId];
                    if(cardData) {
                        const cardEl = createCardElement(cardData);
                        columnEl.appendChild(cardEl);
                    }
                });
            });
        }

        // Função para criar elemento de card
        function createCardElement(cardData) {
            const card = document.createElement('div');
            card.className = 'kanban-card';
            card.setAttribute('draggable', 'true');
            card.dataset.cardId = cardData.id;
            
            card.innerHTML = `
                <span class="card-sprint">${cardData.sprint}</span>
                <div class="card-title">${cardData.title}</div>
                <div class="card-description">${cardData.description}</div>
                <div class="card-links">
                    ${cardData.related ? cardData.related.map(id => `<a href="#" class="card-link" data-card="${id}">↳ Relacionado</a>`).join('') : ''}
                </div>
            `;
            
            card.addEventListener('click', () => openModal(cardData));
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            // Adicionar event listeners para os links relacionados
            const relatedLinks = card.querySelectorAll('.card-link');
            relatedLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const relatedCardId = link.dataset.card;
                    const relatedCardData = state.cards[relatedCardId];
                    if (relatedCardData) {
                        openModal(relatedCardData);
                    }
                });
            });

            return card;
        }

        // Lógica do Modal
        function openModal(cardData) {
            modalTitle.textContent = cardData.title;
            modalBody.innerHTML = cardData.content;
            modal.style.display = 'block';
            
            // Adicionar event listeners para os links relacionados no modal
            const relatedLinks = modalBody.querySelectorAll('.related-link');
            relatedLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const relatedCardId = link.dataset.card;
                    const relatedCardData = state.cards[relatedCardId];
                    if (relatedCardData) {
                        openModal(relatedCardData);
                    }
                });
            });
            
            if (cardData.id === 's5-2') {
                setTimeout(renderBurndownChart, 50);
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        closeButton.addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target == modal) {
                closeModal();
            }
        });
        
        // Lógica de Drag and Drop
        let draggedCardId = null;

        function handleDragStart(e) {
            draggedCardId = e.target.dataset.cardId;
            setTimeout(() => e.target.classList.add('dragging'), 0);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedCardId = null;
        }

        const columns = document.querySelectorAll('.kanban-cards');
        columns.forEach(column => {
            column.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                column.classList.add('drag-over');
            });
            column.addEventListener('dragleave', e => {
                 column.classList.remove('drag-over');
            });
            column.addEventListener('drop', e => {
                e.preventDefault();
                column.classList.remove('drag-over');
                const targetColumnId = column.dataset.columnId;
                
                if (draggedCardId) {
                    Object.keys(state.columns).forEach(colId => {
                        const index = state.columns[colId].indexOf(draggedCardId);
                        if (index > -1) {
                            state.columns[colId].splice(index, 1);
                        }
                    });

                    state.columns[targetColumnId].push(draggedCardId);
                    
                    saveState();
                    renderBoard();
                }
            });
        });

        // Renderização do Gráfico Burndown
        function renderBurndownChart() {
            const container = document.getElementById('burndown-chart-container');
            if (!container || container.querySelector('svg')) return;

            const sprints = 10;
            const totalPoints = 200;
            const actualData = [200, 185, 170, 165, 140, 130, 105, 80, 55, 20, 0];
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");
            svg.setAttribute("viewBox", "0 0 500 300");
            const padding = 40;
            const chartWidth = 500 - padding * 2;
            const chartHeight = 300 - padding * 2;

            const xAxis = document.createElementNS(svgNS, "line");
            xAxis.setAttribute("x1", padding);
            xAxis.setAttribute("y1", chartHeight + padding);
            xAxis.setAttribute("x2", chartWidth + padding);
            xAxis.setAttribute("y2", chartHeight + padding);
            xAxis.classList.add('axis');
            svg.appendChild(xAxis);

            const yAxis = document.createElementNS(svgNS, "line");
            yAxis.setAttribute("x1", padding);
            yAxis.setAttribute("y1", padding);
            yAxis.setAttribute("x2", padding);
            yAxis.setAttribute("y2", chartHeight + padding);
            yAxis.classList.add('axis');
            svg.appendChild(yAxis);

            for (let i = 0; i <= sprints; i++) {
                const x = padding + (i / sprints) * chartWidth;
                const label = document.createElementNS(svgNS, 'text');
                label.setAttribute('x', x);
                label.setAttribute('y', chartHeight + padding + 20);
                label.setAttribute('text-anchor', 'middle');
                label.classList.add('label');
                label.textContent = `S` + i;
                svg.appendChild(label);
            }
             for (let i = 0; i <= 4; i++) {
                const y = padding + chartHeight - (i/4 * chartHeight);
                const label = document.createElementNS(svgNS, 'text');
                label.setAttribute('x', padding - 10);
                label.setAttribute('y', y + 4);
                label.setAttribute('text-anchor', 'end');
                label.classList.add('label');
                label.textContent = (i/4 * totalPoints);
                svg.appendChild(label);
            }

            const idealLine = document.createElementNS(svgNS, "line");
            idealLine.setAttribute("x1", padding);
            idealLine.setAttribute("y1", padding);
            idealLine.setAttribute("x2", chartWidth + padding);
            idealLine.setAttribute("y2", chartHeight + padding);
            idealLine.classList.add('ideal-line');
            svg.appendChild(idealLine);

            let points = "";
            actualData.forEach((pointsLeft, i) => {
                const x = padding + (i / sprints) * chartWidth;
                const y = padding + chartHeight - (pointsLeft / totalPoints) * chartHeight;
                points += `${x},${y} `;
                
                const point = document.createElementNS(svgNS, 'circle');
                point.setAttribute('cx', x);
                point.setAttribute('cy', y);
                point.setAttribute('r', 5);
                point.classList.add('point');
                svg.appendChild(point);
            });
            const actualPolyline = document.createElementNS(svgNS, "polyline");
            actualPolyline.setAttribute("points", points.trim());
            actualPolyline.classList.add('actual-line');
            svg.appendChild(actualPolyline);

            container.innerHTML = '';
            container.appendChild(svg);
        }
        
        // Lógica do Reset
        resetButton.addEventListener('click', () => {
            if (confirm('Tem certeza que deseja resetar o quadro? Todo o seu progresso será perdido.')) {
                localStorage.removeItem('kanbanState_v4');
                state.columns = {'backlog': [], 'todo': [], 'inprogress': [], 'done': []};
                state.cards = {};
                studyData.forEach(cardData => {
                    state.cards[cardData.id] = cardData;
                    state.columns.backlog.push(cardData.id);
                });
                renderBoard();
            }
        });

        // Lógica do Tema
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            themeToggle.textContent = isDarkMode ? '🌙' : '☀️';
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', toggleTheme);

        // Carregar tema salvo
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '🌙';
        }

        // Carregamento Inicial
        loadState();
        renderBoard();
    });
    </script>
</body>
</html>
