<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estudos KANBAN do PO Ágil (Versão Completa)</title>
    <style>
        :root {
            --background-color: #f4f7fa;
            --main-text-color: #333;
            --secondary-text-color: #555;
            --primary-color: #007acc;
            --primary-hover-color: #005f9e;
            --card-bg-color: #ffffff;
            --board-bg-color: #e9ebee;
            --column-header-bg: #f8f9fa;
            --border-color: #d1d5da;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --code-font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
        }

        /* Reset Básico e Configuração */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--main-text-color);
            line-height: 1.7;
            font-size: 16px;
        }
        
        /* Cabeçalho Principal */
        header {
            background-color: var(--card-bg-color);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 10;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        #reset-button {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        #reset-button:hover {
            background-color: #c82333;
        }

        /* Quadro Kanban */
        #kanban-board {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            height: calc(100vh - 70px);
            overflow-x: auto;
            background-color: var(--board-bg-color);
        }

        .kanban-column {
            flex: 1;
            min-width: 320px;
            max-width: 320px;
            background-color: var(--column-header-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 1px 3px var(--shadow-color);
            transition: box-shadow 0.3s ease;
        }
        
        .kanban-column:hover {
             box-shadow: 0 4px 12px var(--shadow-color);
        }

        .kanban-column h2 {
            font-size: 1.1rem;
            padding: 0.8rem;
            border-bottom: 2px solid var(--border-color);
            background-color: var(--card-bg-color);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .kanban-cards {
            flex-grow: 1;
            padding: 0.8rem;
            overflow-y: auto;
            transition: background-color 0.3s ease;
        }
        
        .kanban-cards.drag-over {
            background-color: #d6eaff;
        }

        /* Cartões Kanban */
        .kanban-card {
            background-color: var(--card-bg-color);
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 0.8rem;
            box-shadow: 0 1px 2px var(--shadow-color);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border-left: 5px solid var(--primary-color);
        }

        .kanban-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px var(--shadow-color);
        }
        
        .kanban-card.dragging {
            opacity: 0.4;
            transform: rotate(4deg);
        }

        .card-sprint {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: inline-block;
            background-color: #eaf2fd;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .card-title {
            font-weight: 600;
            color: var(--main-text-color);
        }

        /* Modal para Conteúdo */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 4% auto;
            padding: 30px 40px;
            border: 1px solid #888;
            width: 85%;
            max-width: 950px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .close-button {
            color: #aaa;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
        }
        
        .modal-body {
            max-height: 75vh;
            overflow-y: auto;
            padding-right: 15px; /* for scrollbar */
        }
        
        .modal-body h3 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-hover-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            font-size: 1.4rem;
        }
        
         .modal-body h4 {
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: var(--main-text-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-body p, .modal-body ul, .modal-body ol {
            margin-bottom: 1rem;
            color: var(--secondary-text-color);
        }

        .modal-body ul, .modal-body ol {
            padding-left: 25px;
        }
        
        .modal-body li {
            margin-bottom: 0.7rem;
        }
        
        .modal-body code {
            background-color: #eef;
            padding: 3px 7px;
            border-radius: 4px;
            font-family: var(--code-font-family);
            color: #333;
            font-size: 0.9rem;
        }
        
        .modal-body blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #666;
        }
        
        .modal-body a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .modal-body a:hover {
            text-decoration: underline;
        }
        
        /* Flashcards */
        .flashcard-container {
            perspective: 1000px;
            margin: 1.5rem 0;
            background-color: transparent;
            width: 100%;
            min-height: 140px;
            border-radius: 8px;
        }
        
        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 140px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 8px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .flashcard-front {
            background: linear-gradient(135deg, #eaf2fd 0%, #d6eaff 100%);
            border: 1px solid var(--primary-color);
        }

        .flashcard-front-title {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--primary-hover-color);
            text-align: center;
        }
        
        .flashcard-front-instruction {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            margin-top: 10px;
            font-style: italic;
        }

        .flashcard-back {
            background: var(--card-bg-color);
            transform: rotateY(180deg);
            border: 1px solid var(--border-color);
            color: var(--secondary-text-color);
            font-size: 1rem;
            text-align: center;
        }
        
        /* Estilos de Gráfico Dinâmico */
        .chart-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            background: var(--card-bg-color);
        }

        .burndown-chart {
            width: 100%;
            height: 300px;
            position: relative;
        }

        .burndown-chart .ideal-line {
            stroke: var(--danger-color);
            stroke-dasharray: 6, 6;
            stroke-width: 2;
        }
        
        .burndown-chart .actual-line {
            stroke: var(--primary-color);
            stroke-width: 2.5;
            fill: none;
        }
        
        .burndown-chart .point {
            fill: var(--primary-hover-color);
            cursor: pointer;
            transition: r 0.2s;
        }
        
        .burndown-chart .point:hover {
            r: 7;
        }
        
        .burndown-chart .axis {
            stroke: var(--secondary-text-color);
            stroke-width: 1.5;
        }
        
        .burndown-chart .label {
            font-size: 12px;
            fill: var(--secondary-text-color);
        }
        
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 20px;
            height: 10px;
            margin-right: 8px;
            border-radius: 2px;
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Classes Utilitárias */
        .highlight {
            background-color: #fff3cd;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-weight: 500;
            color: #5d4800;
        }

    </style>
</head>
<body>

    <header>
        <h1>Guia de Estudos KANBAN do PO Ágil (Versão Completa)</h1>
        <button id="reset-button">Resetar Quadro</button>
    </header>

    <main id="kanban-board">
        <div class="kanban-column" id="backlog">
            <h2>Backlog</h2>
            <div class="kanban-cards" data-column-id="backlog"></div>
        </div>
        <div class="kanban-column" id="todo">
            <h2>A Fazer (To Do)</h2>
            <div class="kanban-cards" data-column-id="todo"></div>
        </div>
        <div class="kanban-column" id="inprogress">
            <h2>Em Progresso</h2>
            <div class="kanban-cards" data-column-id="inprogress"></div>
        </div>
        <div class="kanban-column" id="done">
            <h2>Concluído (Done)</h2>
            <div class="kanban-cards" data-column-id="done"></div>
        </div>
    </main>

    <div id="contentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body" id="modal-body">
                </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const studyData = [
            // SPRINT 1: FUNDAÇÕES
            {
                id: 's1-1', sprint: 'SPRINT 1: Fundações do PO', title: 'O Papel do Product Owner (PO)', content: `<h3>O que é um Product Owner?</h3><p>O Product Owner é um membro fundamental do Time Scrum, atuando como o principal responsável por maximizar o valor do produto que resulta do trabalho do Time de Desenvolvimento. Ele é a única pessoa com a autoridade para gerenciar o Product Backlog, servindo como a ponte essencial entre os stakeholders (partes interessadas) e o time técnico.</p><blockquote>O PO é o dono do "o quê" e do "porquê". O Time de Desenvolvimento é o dono do "como".</blockquote><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">Principal Responsabilidade do PO</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span>Maximizar o valor do produto através do gerenciamento contínuo e priorização do Product Backlog. Isso inclui sua criação, ordenação e garantia de que ele seja visível, transparente e compreendido por todos.</span></div></div></div><h3>Responsabilidades Chave Detalhadas:</h3><ul><li><b>Definir e Comunicar a Visão:</b> Criar uma visão de produto clara, inspiradora e alinhada com os objetivos da empresa. O PO deve garantir que todos no Time Scrum entendam essa visão.</li><li><b>Gerenciar o Product Backlog:</b> Esta é uma atividade contínua que envolve:<ul><li>Expressar claramente os itens do Backlog (PBI - Product Backlog Items).</li><li>Ordenar os itens para otimizar o alcance de metas e missões.</li><li>Garantir que o valor do trabalho que o time realiza seja maximizado.</li><li>Assegurar que o Backlog seja visível, transparente e claro para todos.</li></ul></li><li><b>Gerenciamento de Stakeholders:</b> O PO é a voz do cliente e do negócio. Deve interagir constantemente com clientes, usuários e outras partes interessadas para coletar feedback, entender suas necessidades e gerenciar suas expectativas.</li><li><b>Participação Ativa nos Eventos Scrum:</b> O PO não é um participante passivo. Ele colabora na Sprint Planning, inspeciona o incremento na Sprint Review e fornece esclarecimentos durante a Daily Scrum, se necessário.</li><li><b>Tomada de Decisão:</b> O PO tem a palavra final sobre o conteúdo e a ordem do Product Backlog. A organização deve respeitar suas decisões.</li></ul>`
            },
            {
                id: 's1-2', sprint: 'SPRINT 1: Fundações do PO', title: 'Características de um PO Eficaz', content: `<h3>O Perfil Ideal do Product Owner</h3><p>Um PO eficaz combina habilidades de negócio, comunicação e liderança. Não se trata apenas de um cargo, mas de uma mentalidade focada em entregar valor.</p><h4>Domínio do Negócio (Domainer)</h4><p>Um PO precisa ter um profundo conhecimento do mercado, dos usuários e do negócio para tomar decisões informadas sobre o produto.</p><h4>Comunicador e Negociador</h4><p>Ele deve ser capaz de articular a visão e as necessidades dos stakeholders de forma clara para o time. Também precisa negociar prioridades com stakeholders que frequentemente têm interesses conflitantes, sempre buscando o maior valor global.</p><h4>Líder Servidor e Jogador de Time</h4><p>O PO lidera pelo exemplo e pela visão, não pela autoridade. Ele guia o time em direção ao objetivo do produto e é um membro colaborativo do Time Scrum.</p><h4>Empoderado e Comprometido</h4><p>A organização deve dar ao PO a autoridade para tomar decisões sobre o produto. Um PO sem poder de decisão se torna um gargalo. Ele deve ser totalmente comprometido com o sucesso do produto.</p><h4>Disponível e Qualificado</h4><p>Um "PO ausente" é um grande problema. Ele precisa estar disponível para o time para tirar dúvidas e dar feedback rápido. Além disso, deve ter o conhecimento necessário para desempenhar o papel.</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">A Analogia da Furadeira</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span>"As pessoas não querem uma furadeira de 3/4 de polegada. Elas querem um buraco de 3/4 de polegada." - Theodore Levitt. <br/>Isso lembra o PO de focar no problema do usuário e no valor (o buraco), não apenas na solução ou na feature (a furadeira).</span></div></div></div>`
            },
            {
                id: 's1-3', sprint: 'SPRINT 1: Fundações do PO', title: 'Erros Comuns (Anti-Padrões) do PO', content: `<h3>Armadilhas a Evitar no Papel de PO</h3><p>Vários anti-padrões podem minar a eficácia de um Product Owner e prejudicar o progresso do time. Reconhecê-los é o primeiro passo para evitá-los.</p><ul><li><b>O PO "Escriba":</b> Um PO que apenas anota pedidos dos stakeholders sem ter poder real de decisão sobre prioridades. Ele se torna um intermediário, não um dono do produto.</li><li><b>O PO "Sobrecarregado":</b> Um PO responsável por muitos produtos ou times ao mesmo tempo. Ele se torna um gargalo, incapaz de dar a atenção necessária a cada um.</li><li><b>O PO "Parcial":</b> Um PO que favorece um grupo de stakeholders em detrimento de outros, falhando em equilibrar as necessidades de todos para maximizar o valor total.</li><li><b>O PO "Fantasma" ou "Distante":</b> Um PO que não está regularmente disponível para o time. Isso causa mal-entendidos, atrasos e trabalho que não atende às expectativas.</li><li><b>O PO "Proxy":</b> Alguém que atua como intermediário para o verdadeiro tomador de decisão. Isso quebra a comunicação direta e a agilidade.</li><li><b>O PO "Comitê":</b> Decisões sobre o produto são tomadas por um comitê. Isso leva a resultados lentos e comprometidos. O PO deve ser um indivíduo único e decisivo.</li><li><b>O PO "Focado em Features":</b> Um PO que apenas se concentra em entregar uma lista de funcionalidades, perdendo de vista o valor para o negócio e o resultado para o usuário.</li></ul>`
            },
            // SPRINT 2: VISÃO & ESTRATÉGIA
            {
                id: 's2-1', sprint: 'SPRINT 2: Visão e Estratégia de Produto', title: 'Definindo a Visão do Produto', content: `<h3>Capturando a Essência do Produto</h3><p>A visão do produto é uma declaração concisa que descreve o objetivo de longo prazo do produto. Ela serve como uma "Estrela Guia" para o Time Scrum e todos os stakeholders, garantindo que todos estejam remando na mesma direção.</p><h4>Qualidades de uma Visão Forte:</h4><ul><li><b>Compartilhada e Unificada:</b> Todos no time e os principais stakeholders devem acreditar e apoiar a visão.</li><li><b>Ampla e Engajadora:</b> Deve ser inspiradora e dar espaço para o time ser criativo na busca por soluções, em vez de prescrever a solução.</li><li><b>Curta e Clara:</b> Fácil de lembrar e repetir. Pense nela como um "elevator pitch".</li></ul><h4>Ferramentas para Criar a Visão</h4><p>Um template popular é o "Elevator Pitch" de Geoffrey Moore:</p><blockquote><b>PARA</b> [cliente alvo]<br><b>QUE</b> [necessidade ou oportunidade]<br><b>O</b> [nome do produto] <b>É UM</b> [categoria do produto]<br><b>QUE</b> [benefício chave, razão para comprar].<br><b>DIFERENTE DE</b> [alternativa da concorrência]<br><b>NOSSO PRODUTO</b> [diferencial chave].</blockquote>`
            },
            {
                id: 's2-2', sprint: 'SPRINT 2: Visão e Estratégia de Produto', title: 'Produto Mínimo Viável (MVP)', content: `<h3>Menos é Mais: O Poder do MVP</h3><p>O princípio de "maximizar a quantidade de trabalho não feito" é central para o desenvolvimento Ágil. O Produto Mínimo Viável (MVP) é a expressão máxima dessa ideia.</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">Produto Mínimo Viável (MVP)</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span>A menor versão de um produto que pode ser lançada para entregar valor a um grupo de usuários iniciais (early adopters) e, crucialmente, coletar o máximo de aprendizado validado sobre eles com o mínimo de esforço.</span></div></div></div><h3>MVP não é...</h3><ul><li>... um produto de baixa qualidade ou cheio de bugs. Ele deve ser <b>Viável</b>.</li><li>... apenas um conjunto de features. Ele deve resolver um problema real para ser <b>Valioso</b>.</li><li>... um protótipo. Ele deve ser um produto funcional que pode ser usado por clientes reais.</li></ul><h3>Vantagens da Abordagem MVP:</h3><ul><li><b>Velocidade para o Mercado (Time-to-Market):</b> Entregar um produto funcional nas mãos dos usuários mais cedo.</li><li><b>Redução de Custos e Maior ROI:</b> Menor investimento inicial e potencial de receita antecipada.</li><li><b>Aprendizado Acelerado:</b> Validar ou invalidar rapidamente as hipóteses do produto com dados reais de uso.</li><li><b>Minimização de Risco:</b> Evitar o risco de construir um produto complexo que ninguém quer usar.</li></ul>`
            },
            {
                id: 's2-3', sprint: 'SPRINT 2: Visão e Estratégia de Produto', title: 'Roadmap de Produto', content: `<h3>Visualizando o Caminho à Frente</h3><p>Enquanto a Visão é o destino, o <b>Roadmap de Produto</b> é um plano estratégico de alto nível que descreve como o produto deve evoluir ao longo do tempo. É um artefato vivo, não um plano fixo e imutável.</p><h4>Roadmap Orientado a Metas (Goal-Oriented)</h4><p>Roadmaps ágeis modernos evitam listas de features com datas fixas. Em vez disso, eles se concentram em metas ou resultados a serem alcançados.</p><h3>Um Bom Roadmap Deve Incluir:</h3><ul><li><b>Linha do Tempo (Horizontes):</b> Geralmente dividida em "Agora", "Próximo" e "Depois" (ou por trimestres) para evitar o compromisso com datas específicas.</li><li><b>Temas ou Metas por Período:</b> Agrupar o trabalho em objetivos principais (ex: "Melhorar a Experiência de Onboarding", "Aumentar a Retenção de Usuários").</li><li><b>Métricas de Sucesso:</b> Como saberemos que atingimos a meta? (ex: "Reduzir o tempo de onboarding em 20%").</li><li><b>Confiança:</b> Indicar o nível de certeza sobre os itens futuros (alta para "Agora", baixa para "Depois").</li></ul><p>O roadmap é uma ferramenta de comunicação crucial para alinhar stakeholders, gerenciar expectativas e facilitar discussões estratégicas. Ele deve ser revisado e adaptado regularmente com base no feedback e no aprendizado.</p>`
            },
            // SPRINT 3: PRODUCT BACKLOG
            {
                id: 's3-1', sprint: 'SPRINT 3: Dominando o Product Backlog', title: 'O que é o Product Backlog?', content: `<h3>A Única Fonte da Verdade</h3><p>O Product Backlog é uma lista ordenada e emergente de tudo o que é conhecido como necessário no produto. É a única fonte de requisitos para quaisquer mudanças a serem feitas no produto. O Product Owner é o único responsável por seu conteúdo, disponibilidade e ordenação.</p><h3>O que há em um Backlog?</h3><p>Um Product Backlog é mais do que apenas uma lista de funcionalidades. Ele pode incluir:</p><ul><li><b>User Stories (Histórias de Usuário):</b> Descrevem uma funcionalidade do ponto de vista do usuário.</li><li><b>Requisitos Funcionais e Não Funcionais (NFRs):</b> Desempenho, segurança, usabilidade, etc.</li><li><b>Trabalho Técnico:</b> Por exemplo, configurar um ambiente, pagar débito técnico, criar uma arquitetura.</li><li><b>Bugs e Defeitos:</b> Itens que precisam ser corrigidos.</li><li><b>Spikes (Tarefas de Pesquisa):</b> Atividades para adquirir conhecimento e reduzir incertezas.</li></ul><blockquote>Um bom backlog é um reflexo da estratégia do produto, mostrando não apenas o que será construído, mas por que e em que ordem.</blockquote>`
            },
            {
                id: 's3-2', sprint: 'SPRINT 3: Dominando o Product Backlog', title: 'Qualidades de um Bom Backlog: DEEP', content: `<h3>As Características DEEP</h3><p>Um Product Backlog de alta qualidade adere ao acrônimo DEEP, que garante que ele seja uma ferramenta útil e eficaz para o Time Scrum.</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">DEEP</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span><b>D</b>etailed appropriately (Detalhado apropriadamente), <b>E</b>stimated (Estimado), <b>E</b>mergent (Emergente), <b>P</b>rioritized (Priorizado).</span></div></div></div><ul><li><b>D - Detalhado Apropriadamente:</b> Itens no topo do backlog (a serem trabalhados em breve) são pequenos, claros e bem detalhados. Itens na base do backlog são maiores (épicos) e menos definidos. Isso é chamado de "cone de incerteza".</li><li><b>E - Estimado:</b> Todo item no backlog tem uma estimativa de tamanho ou esforço, fornecida pelo Time de Desenvolvimento. Isso é crucial para o planejamento e a priorização.</li><li><b>E - Emergente:</b> O backlog nunca está completo. Ele evolui constantemente à medida que o produto, o mercado e o aprendizado do time evoluem. Novos itens são adicionados, existentes são alterados ou removidos.</li><li><b>P - Priorizado (ou Ordenado):</b> Todos os itens são ranqueados em ordem. Os itens de maior valor e importância estão no topo, garantindo que o time esteja sempre trabalhando no que é mais impactante.</li></ul>`
            },
            {
                id: 's3-3', sprint: 'SPRINT 3: Dominando o Product Backlog', title: 'Refinamento do Backlog (Grooming)', content: `<h3>Mantendo a Saúde do Backlog</h3><p>O Refinamento do Backlog (anteriormente chamado de Grooming) é o processo contínuo de adicionar detalhes, estimativas e ordem aos itens do Product Backlog. Não é um evento formal do Scrum com tempo fixo, mas uma atividade colaborativa contínua.</p><p>O Guia Scrum sugere que o Time de Desenvolvimento pode dedicar até <b>10% de sua capacidade</b> a essa atividade.</p><h3>Atividades Chave do Refinamento:</h3><ul><li><b>Analisar e detalhar itens:</b> Discutir os itens do topo do backlog para garantir um entendimento compartilhado.</li><li><b>Quebrar itens grandes (Épicos):</b> Dividir épicos em User Stories menores e mais gerenciáveis que possam ser concluídas em uma única sprint.</li><li><b>Adicionar Critérios de Aceite:</b> Definir as condições que uma história deve satisfazer para ser considerada "concluída".</li><li><b>Estimar o esforço:</b> O Time de Desenvolvimento estima os itens refinados.</li><li><b>Identificar e remover itens obsoletos:</b> Manter o backlog limpo e relevante.</li></ul><p>Um refinamento eficaz garante que o time tenha uma reserva de trabalho bem compreendido e "pronto" (Ready) para futuras Sprints, tornando as reuniões de Sprint Planning muito mais suaves, rápidas e produtivas.</p>`
            },
            {
                id: 's3-4', sprint: 'SPRINT 3: Dominando o Product Backlog', title: 'User Stories e Critérios INVEST', content: `<h3>Escrevendo Requisitos Eficazes</h3><p>User Stories (Histórias de Usuário) são uma forma popular de expressar os itens do backlog. Elas são curtas, simples e descrevem uma funcionalidade da perspectiva da pessoa que deseja o novo recurso.</p><h4>O Formato Comum (Template de Connextra):</h4><blockquote><b>COMO UM</b> [tipo de usuário],<br><b>EU QUERO</b> [algum objetivo],<br><b>PARA QUE</b> [alguma razão/valor].</blockquote><p>O mais importante é o valor ("PARA QUE"). Ele conecta a funcionalidade a um resultado de negócio ou de usuário.</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">Critérios INVEST para boas User Stories</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span><b>I</b>ndependent, <b>N</b>egotiable, <b>V</b>aluable, <b>E</b>stimable, <b>S</b>mall, <b>T</b>estable.</span></div></div></div><ul><li><b>I - Independente:</b> A história deve ser autocontida, evitando dependências rígidas com outras histórias.</li><li><b>N - Negociável:</b> A história não é um contrato. Ela é um convite à conversa entre o PO e o time para definir os detalhes.</li><li><b>V - Valiosa:</b> Deve entregar valor claro para o usuário ou cliente.</li><li><b>E - Estimável:</b> O time deve ser capaz de estimar o esforço necessário para implementá-la.</li><li><b>S - Pequena (Small):</b> Pequena o suficiente para ser concluída dentro de uma Sprint.</li><li><b>T - Testável:</b> A história deve ser testável para que se possa verificar sua conclusão, geralmente através de Critérios de Aceite.</li></ul>`
            },
            // SPRINT 4: PRIORITIZAÇÃO & ESTIMATIVA
            {
                id: 's4-1', sprint: 'SPRINT 4: Priorização e Estimativa', title: 'Técnicas de Priorização', content: `<h3>Como Decidir "O Que Vem a Seguir?"</h3><p>Priorização é uma das responsabilidades mais críticas do PO. É um equilíbrio cuidadoso de múltiplos fatores para maximizar a entrega de valor ao longo do tempo. O PO tem a palavra final sobre a ordem do backlog.</p><h4>Critérios Comuns de Priorização:</h4><ul><li><b>Valor para o Negócio/Cliente:</b> Qual o benefício? Este é geralmente o principal motivador.</li><li><b>Custo de Atraso (Cost of Delay):</b> Qual o custo de não ter essa funcionalidade agora?</li><li><b>Risco e Incerteza:</b> Às vezes, é sábio abordar itens de alto risco ou incerteza mais cedo para ganhar conhecimento (mitigação de risco).</li><li><b>Dependências:</b> Se o item B depende do item A, o item A deve ser priorizado antes.</li><li><b>Tamanho/Esforço:</b> Às vezes, entregar rapidamente itens pequenos e de alto valor (quick wins) pode ser uma boa estratégia.</li></ul><h4>Frameworks de Priorização:</h4><ul><li><b>MoSCoW:</b> Categoriza os itens em <b>M</b>ust have (Deve ter), <b>S</b>hould have (Deveria ter), <b>C</b>ould have (Poderia ter), e <b>W</b>on't have (Não terá agora).</li><li><b>Modelo Kano:</b> Classifica as funcionalidades com base em seu potencial para satisfazer os clientes (Básicas, de Performance, de Encantamento).</li><li><b>WSJF (Weighted Shortest Job First):</b> Uma técnica do SAFe que prioriza itens com base na divisão do Custo de Atraso pelo tamanho do trabalho. <code>WSJF = Custo de Atraso / Tamanho</code>.</li></ul>`
            },
            {
                id: 's4-2', sprint: 'SPRINT 4: Priorização e Estimativa', title: 'Estimativa Relativa e Planning Poker', content: `<h3>Estimando Esforço, Não Tempo</h3><p>Em ambientes complexos, estimar em unidades de tempo absolutas (horas, dias) é impreciso e muitas vezes enganoso. Times ágeis usam <span class="highlight">estimativa relativa</span>, comparando o tamanho de um item com outros.</p><p>As estimativas são fornecidas pelo Time de Desenvolvimento, pois são eles que realizarão o trabalho. O PO esclarece o "o quê", mas não influencia o "quanto".</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">Story Points (Pontos de História)</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span>Uma unidade de medida abstrata para expressar o esforço relativo necessário para implementar um item do backlog. Combina complexidade, incerteza e quantidade de trabalho. Não se correlaciona diretamente com horas.</span></div></div></div><h3>Planning Poker®</h3><p>Planning Poker é uma técnica baseada em consenso para estimar, geralmente usando Story Points.</p><ol><li>O PO apresenta um item do backlog e esclarece dúvidas.</li><li>Cada membro do time de desenvolvimento seleciona privadamente uma carta que representa sua estimativa (geralmente da sequência de Fibonacci modificada: 0, 1, 2, 3, 5, 8, 13, 20...).</li><li>Todos revelam suas cartas simultaneamente.</li><li>Se as estimativas divergirem muito, os que votaram mais alto e mais baixo explicam seu raciocínio.</li><li>O time discute para chegar a um entendimento compartilhado e vota novamente até que o consenso seja alcançado.</li></ol><p>Este processo promove a colaboração e garante que toda a equipe compreenda o escopo do trabalho.</p>`
            },
            // SPRINT 5: PLANEJAMENTO, EXECUÇÃO & MÉTRICAS
            {
                id: 's5-1', sprint: 'SPRINT 5: Planejamento, Execução & Métricas', title: 'Planejamento de Release e Velocidade', content: `<h3>Prevendo o Futuro</h3><p>Um Plano de Release responde às perguntas: "O que será entregue e aproximadamente quando?" Não é uma garantia, mas uma previsão que é continuamente atualizada com base no progresso empírico do time.</p><p>Uma das variáveis chave no planejamento Ágil é fixar tempo e custo (o time é fixo para a Sprint), mas permitir que o escopo seja flexível.</p><h3>Velocidade (Velocity)</h3><p>Velocidade é a medida da quantidade de trabalho (em Story Points) que um time consegue concluir ("Done") durante uma única Sprint. É calculada no final da sprint somando os pontos de todos os itens do backlog totalmente concluídos.</p><div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle('is-flipped')"><div class="flashcard-face flashcard-front"><span class="flashcard-front-title">Para que serve a Velocidade?</span><span class="flashcard-front-instruction">(Clique para revelar)</span></div><div class="flashcard-face flashcard-back"><span>Primariamente para planejamento futuro. Sabendo a velocidade média do time, o PO pode prever quantas Sprints serão necessárias para concluir um determinado escopo. <b>Não deve ser usada como métrica de produtividade ou para comparar times.</b></span></div></div></div><p>Leva algumas sprints para a velocidade de um novo time se estabilizar. Fatores como feriados, mudanças no time e complexidade técnica podem fazê-la flutuar. O PO deve usar a média das últimas 3-4 sprints para previsões.</p>`
            },
            {
                id: 's5-2', sprint: 'SPRINT 5: Planejamento, Execução & Métricas', title: 'Gráfico de Release Burndown', content: `<h3>Visualizando o Progresso ao Longo do Tempo</h3><p>Um gráfico de Release Burndown é uma ferramenta poderosa para rastrear o progresso ao longo de múltiplas sprints e prever a conclusão. Ele visualiza a quantidade de trabalho restante em relação ao tempo.</p><p>O gráfico é atualizado ao final de cada Sprint Review, tornando o progresso (ou a falta dele) transparente para todos os stakeholders.</p><div class="chart-container"><h3>Exemplo de Release Burndown</h3><div id="burndown-chart-container" class="burndown-chart"></div><div class="chart-legend"><div class="legend-item"><div class="legend-color" style="background-color: var(--danger-color); border: 1px dashed #555;"></div> Linha Ideal</div><div class="legend-item"><div class="legend-color" style="background-color: var(--primary-color);"></div> Linha Real</div></div></div><h3>Elementos Chave:</h3><ul><li><b>Eixo X (Horizontal):</b> Sprints (tempo).</li><li><b>Eixo Y (Vertical):</b> Trabalho restante (geralmente em Story Points).</li><li><b>Linha Ideal:</b> Uma linha reta que mostra o caminho teórico para a conclusão se o trabalho for completado a uma taxa perfeitamente constante.</li><li><b>Linha Real:</b> Uma linha que mostra o trabalho real restante no final de cada sprint. Esta linha flutua com base no desempenho do time e em quaisquer alterações de escopo (adição ou remoção de itens do backlog).</li></ul><p>Se a linha real estiver consistentemente acima da ideal, isso indica que o projeto pode atrasar. Se estiver abaixo, pode terminar antes do previsto.</p>`
            },
            {
                id: 's5-3', sprint: 'SPRINT 5: Planejamento, Execução & Métricas', title: 'O PO nos Eventos Scrum', content: `<h3>Participação Ativa e Engajada</h3><p>O envolvimento do Product Owner nos eventos Scrum é fundamental para o sucesso do time. Não é opcional.</p><h4>Sprint Planning</h4><p>O PO é responsável por apresentar o objetivo da Sprint e os itens do Product Backlog de maior prioridade. Ele colabora com o Time de Desenvolvimento para que eles selecionem o trabalho que pode ser feito, mas é o time que decide o quanto puxar para a Sprint. O PO deve estar disponível para esclarecer dúvidas durante todo o evento.</p><h4>Daily Scrum</h4><p>Embora a Daily Scrum seja para o Time de Desenvolvimento, é altamente benéfico que o PO participe (como observador) para se manter informado e estar disponível para responder a perguntas imediatas, evitando bloqueios.</p><h4>Sprint Review</h4><p>Este é um evento chave para o PO. Não é uma simples demonstração. É uma sessão de trabalho para inspecionar o incremento e adaptar o Product Backlog. O PO inicia a revisão, apresenta os resultados e é responsável por aceitar ou rejeitar o trabalho feito com base na Definição de Pronto (Definition of Done) e nos critérios de aceite. O feedback dos stakeholders coletado aqui é crucial.</p><h4>Sprint Retrospective</h4><p>O PO é um membro do Time Scrum e sua participação na retrospectiva é vital. Ele colabora na identificação de melhorias no processo, na comunicação e na eficácia geral do time. Uma relação de confiança entre o PO e o Time de Desenvolvimento é a base para retrospectivas produtivas.</p>`
            },

                        state.cards[cardData.id] = cardData;
                        if (!Object.values(state.columns).flat().includes(cardData.id)) {
                           state.columns.backlog.push(cardData.id);
                        }
                    }
                });
            } else {
                studyData.forEach(cardData => {
                    state.cards[cardData.id] = cardData;
                    state.columns.backlog.push(cardData.id);
                });
            }
        }

        function renderBoard() {
            Object.keys(state.columns).forEach(columnId => {
                const columnEl = document.querySelector(`[data-column-id="${columnId}"]`);
                columnEl.innerHTML = '';
                state.columns[columnId].forEach(cardId => {
                    const cardData = state.cards[cardId];
                    if(cardData) {
                        const cardEl = createCardElement(cardData);
                        columnEl.appendChild(cardEl);
                    }
                });
            });
        }

        function createCardElement(cardData) {
            const card = document.createElement('div');
            card.className = 'kanban-card';
            card.setAttribute('draggable', 'true');
            card.dataset.cardId = cardData.id;
            
            card.innerHTML = `
                <span class="card-sprint">${cardData.sprint}</span>
                <div class="card-title">${cardData.title}</div>
            `;
            
            card.addEventListener('click', () => openModal(cardData));
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            return card;
        }

        // Lógica do Modal
        function openModal(cardData) {
            modalTitle.textContent = cardData.title;
            modalBody.innerHTML = cardData.content;
            modal.style.display = 'block';
            
            if (cardData.id === 's5-2') {
                setTimeout(renderBurndownChart, 50);
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        closeButton.addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target == modal) {
                closeModal();
            }
        });
        
        // Lógica de Drag and Drop
        let draggedCardId = null;

        function handleDragStart(e) {
            draggedCardId = e.target.dataset.cardId;
            setTimeout(() => e.target.classList.add('dragging'), 0);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedCardId = null;
        }

        const columns = document.querySelectorAll('.kanban-cards');
        columns.forEach(column => {
            column.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                column.classList.add('drag-over');
            });
            column.addEventListener('dragleave', e => {
                 column.classList.remove('drag-over');
            });
            column.addEventListener('drop', e => {
                e.preventDefault();
                column.classList.remove('drag-over');
                const targetColumnId = column.dataset.columnId;
                
                if (draggedCardId) {
                    Object.keys(state.columns).forEach(colId => {
                        const index = state.columns[colId].indexOf(draggedCardId);
                        if (index > -1) {
                            state.columns[colId].splice(index, 1);
                        }
                    });

                    state.columns[targetColumnId].push(draggedCardId);
                    
                    saveState();
                    renderBoard();
                }
            });
        });

        // Renderização do Gráfico Burndown
        function renderBurndownChart() {
            const container = document.getElementById('burndown-chart-container');
            if (!container || container.querySelector('svg')) return;

            const sprints = 10;
            const totalPoints = 200;
            const actualData = [200, 185, 170, 165, 140, 130, 105, 80, 55, 20, 0];
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");
            svg.setAttribute("viewBox", "0 0 500 300");
            const padding = 40;
            const chartWidth = 500 - padding * 2;
            const chartHeight = 300 - padding * 2;

            const xAxis = document.createElementNS(svgNS, "line");
            xAxis.setAttribute("x1", padding);
            xAxis.setAttribute("y1", chartHeight + padding);
            xAxis.setAttribute("x2", chartWidth + padding);
            xAxis.setAttribute("y2", chartHeight + padding);
            xAxis.classList.add('axis');
            svg.appendChild(xAxis);

            const yAxis = document.createElementNS(svgNS, "line");
            yAxis.setAttribute("x1", padding);
            yAxis.setAttribute("y1", padding);
            yAxis.setAttribute("x2", padding);
            yAxis.setAttribute("y2", chartHeight + padding);
            yAxis.classList.add('axis');
            svg.appendChild(yAxis);

            for (let i = 0; i <= sprints; i++) {
                const x = padding + (i / sprints) * chartWidth;
                const label = document.createElementNS(svgNS, 'text');
                label.setAttribute('x', x);
                label.setAttribute('y', chartHeight + padding + 20);
                label.setAttribute('text-anchor', 'middle');
                label.classList.add('label');
                label.textContent = `S` + i;
                svg.appendChild(label);
            }
             for (let i = 0; i <= 4; i++) {
                const y = padding + chartHeight - (i/4 * chartHeight);
                const label = document.createElementNS(svgNS, 'text');
                label.setAttribute('x', padding - 10);
                label.setAttribute('y', y + 4);
                label.setAttribute('text-anchor', 'end');
                label.classList.add('label');
                label.textContent = (i/4 * totalPoints);
                svg.appendChild(label);
            }

            const idealLine = document.createElementNS(svgNS, "line");
            idealLine.setAttribute("x1", padding);
            idealLine.setAttribute("y1", padding);
            idealLine.setAttribute("x2", chartWidth + padding);
            idealLine.setAttribute("y2", chartHeight + padding);
            idealLine.classList.add('ideal-line');
            svg.appendChild(idealLine);

            let points = "";
            actualData.forEach((pointsLeft, i) => {
                const x = padding + (i / sprints) * chartWidth;
                const y = padding + chartHeight - (pointsLeft / totalPoints) * chartHeight;
                points += `${x},${y} `;
                
                const point = document.createElementNS(svgNS, 'circle');
                point.setAttribute('cx', x);
                point.setAttribute('cy', y);
                point.setAttribute('r', 5);
                point.classList.add('point');
                svg.appendChild(point);
            });
            const actualPolyline = document.createElementNS(svgNS, "polyline");
            actualPolyline.setAttribute("points", points.trim());
            actualPolyline.classList.add('actual-line');
            svg.appendChild(actualPolyline);

            container.innerHTML = '';
            container.appendChild(svg);
        }
        
        // Lógica do Reset
        resetButton.addEventListener('click', () => {
            if (confirm('Tem certeza que deseja resetar o quadro? Todo o seu progresso será perdido.')) {
                localStorage.removeItem('kanbanState_v3');
                state.columns = {'backlog': [], 'todo': [], 'inprogress': [], 'done': []};
                state.cards = {};
                studyData.forEach(cardData => {
                    state.cards[cardData.id] = cardData;
                    state.columns.backlog.push(cardData.id);
                });
                renderBoard();
            }
        });

        // Carregamento Inicial
        loadState();
        renderBoard();
    });
    </script>
</body>
</html>
