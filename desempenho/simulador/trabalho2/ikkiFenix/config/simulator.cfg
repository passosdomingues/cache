# Simulation Configuration File
# Advanced Queueing System Simulator

# Basic parameters
target_occupancy = 0.8
random_seed = 42
simulation_time = 86400.0
sampling_interval = 10.0

# Queue configuration  
num_queues = 3
discard_policy = drop_tail
max_queue_size = 1000

# Service rates for each queue (must match num_queues)
service_rate_1 = 1.0
service_rate_2 = 1.0  
service_rate_3 = 1.0

# Scheduling policy
# Options: RoundRobin, WaitingTimePriority, UtilityBased, LargestQueue
scheduling_policy = RoundRobin

# Output configuration
output_directory = results
verbose_logging = false